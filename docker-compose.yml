version: '3.8'

services:
  imdf-builder:
    # This fork must be built locally — the upstream image still listens on
    # port 3000 and lacks this fork's changes.
    # image: ghcr.io/loryanstrant/imdf-builder-for-places:latest
    build: .
    ports:
      # Change HOST_PORT in .env (or your environment) to avoid conflicts on 3009.
      - "${HOST_PORT:-3009}:3009"
    volumes:
      - ./projects:/app/projects
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      # Set TZ in .env (e.g. Australia/Sydney) to control the container's timezone.
      - TZ=${TZ:-UTC}
